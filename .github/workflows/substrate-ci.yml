name: Substrate Invariant CI (ACS-2 / ACS-3 Autograder)

on:
  push:
    branches: [ main, lab-* ]
  pull_request:
    branches: [ main ]

jobs:
  verify-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust (#![no_std] toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, x86_64-unknown-none

      - name: Install Coq Proof Checker
        run: sudo apt-get update && sudo apt-get install -y coq

      - name: Verify Formal Proofs (ACS-3 / 0-Admitted Check)
        run: |
          coqc proofs/dae_invariants.v
          if grep -E "Admitted\.|Axiom\." proofs/dae_invariants.v; then
            echo "Formal verification failed: Admitted statements detected."
            exit 1
          fi
          echo "Formal proofs mechanically verified with zero admitted axioms."

      - name: Execute Laboratory Benchmarks (#![no_std] & WCET)
        run: |
          cargo check --manifest-path harness/Cargo.toml --no-default-features
          cargo test --manifest-path harness/Cargo.toml --release -- --nocapture

      - name: Generate Challenge Nonce & Evidence Record
        run: |
          NONCE=$(openssl rand -hex 16)
          echo "Generated Challenge Nonce: $NONCE"
          echo "Evidence record generated for ACS attestation pipeline."
