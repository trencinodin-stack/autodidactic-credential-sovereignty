name: Substrate Invariant CI (ACS-2 / ACS-3 / ACS-4 Autograder)

on:
  push:
    branches: [ main, lab-* ]
  pull_request:
    branches: [ main ]

jobs:
  verify-invariants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust (#![no_std] toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, x86_64-unknown-none

      - name: Install Coq Proof Checker
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends coq

      - name: Setup Node & Install Circom
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Circom Compiler & Dependencies
        run: |
          npm install circomlib
          curl -L https://github.com/iden3/circom/releases/latest/download/circom-linux-amd64 -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Verify Core Invariants (Coq & Harness)
        run: |
          coqc proofs/dae_invariants.v
          cargo test --manifest-path harness/Cargo.toml --release

      - name: Verify Quantitative Finance Domain
        run: |
          coqc domains/quant-finance/proofs/quant_invariants.v
          cargo test --manifest-path domains/quant-finance/harness/Cargo.toml --release

      - name: Verify Aerospace Avionics Domain
        run: |
          coqc domains/aerospace-avionics/proofs/avionics_invariants.v
          cargo test --manifest-path domains/aerospace-avionics/harness/Cargo.toml --release

      - name: Verify Cryptographic Protocols Domain
        run: |
          coqc domains/crypto-protocols/proofs/crypto_invariants.v
          cargo test --manifest-path domains/crypto-protocols/harness/Cargo.toml --release

      - name: Verify ACS-4 ZK Circuit Compilation
        run: |
          circom zk/dae_verifier.circom --r1cs --wasm --sym -o zk/ -l node_modules

      - name: Generate Challenge Nonce & Evidence Record
        run: |
          NONCE=$(openssl rand -hex 16)
          echo "Generated Challenge Nonce: $NONCE"
          echo "Multi-domain ACS attestation complete."
